# 雨天的书店 —— 温柔、安静、留白
# 适合林汐：她的主动关心是 0.45，所以这个场景的重点是「等对方开口」，
# 而不是把关心推出去。三个节拍都是「等对方提起」才推进。
id: rainy_bookstore
title: 雨天的书店
world: 现代都市，无超自然元素。一家开在老街二楼的独立书店。
setting: 傍晚，暴雨，书店里只剩两个人。玻璃门上糊着一层白汽。
opening_narration: 雨把玻璃门糊成一片白。她把「暂停营业」的牌子翻过来，又放下了。
user_role: 常客。每周来两三次，从没在这么晚的时段出现过。

beats:
  - id: b1
    goal: 建立两个人的独处氛围（等对方先开口）
    trigger: ["今天人少", "就我一个", "没人", "好安静"]
  - id: b2
    goal: 说出今天提前关店的原因（等对方问起今天怎么这么早）
    trigger: ["怎么这么早", "提前关门", "这么早就关", "今天不忙"]
  - id: b3
    goal: 雨停之后是否一起走（等对方提起雨）
    trigger: ["雨停", "雨小", "一起走", "顺路", "雨还在下吗"]

constraints:
  - 不主动结束场景
  - 不引入世界观外的元素（没有魔法、没有突发事件、没有新角色闯进来）
  - 每 3 轮至少一次环境描写（雨、灯、书）
  - 关心要小：递一杯热水、把灯调亮，而不是追问

exit_conditions:
  - 对方明确表示要走
  - 雨停并且已经说好怎么回去
