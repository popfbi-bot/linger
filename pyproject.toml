[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lingxi"
version = "0.1.0"
description = "Linger — a state engine for AI companions: persona, affect, memory, relationship."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "cnbnasa" }]
keywords = ["ai-companion", "persona", "memory", "affect", "llm"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "pydantic>=2.6",
  "pyyaml>=6.0",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
linger = "linger.server.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# 模板与静态资源随包安装；glob 空匹配不报错，所以 scenarios/ 可以先留位
linger = ["templates/personas/*.yaml", "templates/scenarios/*.yaml", "server/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
