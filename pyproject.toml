[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lingxi"
version = "0.1.0"
description = "Linger — a state engine for AI companions: persona, affect, memory, relationship."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "cnbnasa" }]
keywords = ["ai-companion", "persona", "memory", "affect", "llm"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "pydantic>=2.6",
  "pyyaml>=6.0",
  "httpx>=0.27",
  # 语音的 multipart 上传（/v1/asr 收浏览器 MediaRecorder 的 Blob）。
  # 没装它时 Starlette 一碰 multipart 就报错，且提示是「装 python-multipart」这种
  # 给人看的文字——只有显式声明成依赖，别人的干净环境才不需要读那句提示。
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]
# 可选后端：只有用 LINGER_STORAGE=postgres 的人需要它。
# 刻意不放进主依赖——替一个后端装一整套驱动，是给所有部署加税。
postgres = ["psycopg[binary,pool]>=3.1"]

[project.scripts]
linger = "linger.server.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# 模板与静态资源随包安装；glob 空匹配不报错，所以 scenarios/ 可以先留位
linger = ["templates/personas/*.yaml", "templates/scenarios/*.yaml", "server/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests", "evals"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
